[project]
name = "experimentation-analysis"
version = "0.1.0"
description = "End-to-end A/B test analysis of the Hillstrom e-mail experiment: SRM checks, CUPED, power, sequential testing, heterogeneous effects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matheus Rissi" }]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "pyarrow",
  "duckdb",
  "matplotlib",
  "pydantic-settings",
  "typer",
  "scikit-uplift",
]

[project.scripts]
xpa = "xpa.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "pyright", "jupyterlab", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xpa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
